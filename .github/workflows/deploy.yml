name: CI/CD - Despliegue con Prerenderizado (Estudio Brkovic)

on:
  push:
    branches:
      - main # Se ejecuta automáticamente cada vez que haces "git push origin main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio de GitHub
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js en la máquina virtual
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalar las dependencias de forma limpia y rápida
      - name: Instalar Dependencias
        run: npm ci

      # 4. Ejecutar el empaquetado (Esto corre "vite build && node prerender.js")
      - name: Compilar Cliente y Generar Prerender de SEO
        run: npm run build

      # 5. Desplegar el resultado empaquetado a Vercel
      - name: Desplegar a Vercel en Producción
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./dist # 👈 CRÍTICO: Sube solo lo prerenderizado, evitando errores de JSX
